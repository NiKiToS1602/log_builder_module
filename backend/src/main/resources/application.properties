spring.application.name=LogBuilder
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/log_builder}
spring.datasource.username=${DB_USER:log_builder}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
